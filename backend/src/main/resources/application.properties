# Server configuration
server.port=8080

# Neo4j Graph Database configuration
neo4j.uri=bolt://localhost:7687
neo4j.username=neo4j
neo4j.password=password

# ML Sidecar prediction service endpoint
ml.sidecar.url=http://localhost:5000/predict

# JWT Configuration
jwt.secret=9a61a48c-7f55-46aa-ae67-d86b97669eb9-super-secret-key-32chars-minimum-length
jwt.expiration=86400000

# ML Fraud detection threshold (probability * 100, must match model_service.py threshold_final * 100)
ml.fraud.threshold=29.62

# File Upload Max limits (for CSV Batch processing)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Log configurations
logging.level.org.springframework.web=INFO
logging.level.com.bankguard=DEBUG
